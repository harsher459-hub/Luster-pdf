name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The Android project ships as a zip in the repo root, so unpack it
      # before Gradle runs. Everything below builds inside GlassPDF/.
      - name: Unpack project
        run: unzip -q -o GlassPDF-project.zip -d "$GITHUB_WORKSPACE"

      - name: Build debug APK
        working-directory: GlassPDF
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassPDF-debug-apk
          path: GlassPDF/app/build/outputs/apk/debug/*.apk

      - name: Build release APK (optimized, debug-signed)
        continue-on-error: true
        working-directory: GlassPDF
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassPDF-release-apk
          path: GlassPDF/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
